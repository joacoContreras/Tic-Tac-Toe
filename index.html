<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="css/style.css" rel="stylesheet">
    <title>Tic Tac Toe</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
</head>
<body>
    <div class="container">

        <div class="header">
            <h1>Tic Tac Toe!</h1>
            <div >
                <img src="img/config.svg" class="header-icon" alt="">
                <img src="img/help1.svg" class="header-icon" alt="">
            </div>
        </div>

        <div class="content">
            <form action="/submit" method="post" class="start-form">
                <div>
                    <label for="player1">Player 1 (X):</label>
                    <input type="text" id="player1" name="player1" placeholder="name..." required maxlength="20">
                </div>
                <div>
                    <label for="player2">Player 2 (O):</label>
                    <input type="text" id="player2" name="player2" placeholder="name..." maxlength="20">
                </div>
                <button type="submit" id="start-btn">
                    <span>New Game</span>
                    <img src="img/next-right-arrow.svg" alt="" class="btn-icon">
                </button>
            </form>

            <div class="game-container hidden">
                <h2 id="game-status" class="game-status"></h2>
                <div class="board" id="board"></div>
                <button id="restart-btn" class="restart-btn">Restart Game</button>
            </div>

        </div>

        <div class="footer">
            <div class="link-container">
                <a>Privacy</a>
                <a>Terms</a>
                <a>Support</a>
            </div>
            <a class="copyright">©2026 Tic Tac Toe, Joaquin Contreras</a>
        </div>
    </div>
    <script src="js/main.js"></script>
</body>
</html>
